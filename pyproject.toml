[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bamboo-eval"
version = "0.1.0"
description = "Bamboo Evaluation Framework — measures retrieval, selection and relevance against labelled corpora, on the production code path."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Paul Nilsson", email = "Paul.Nilsson@cern.ch" }]
# Deliberately empty. The deterministic metrics are pure standard library so
# they run on a bare checkout; a metric that needs a backend degrades to a
# recorded skip with a reason, never to a wrong number. bamboo-core is NOT a
# hard dependency so that `pip install bamboo-eval` in a CI job that only reads
# stored results does not drag in the server; production.py raises a typed
# error naming the install command when a metric actually needs it.
dependencies = []

[project.optional-dependencies]
# The system under test. Install from a checkout:
#   pip install -e ../bamboo-mcp/core -e ../bamboo-mcp/packages/askpanda_atlas
bamboo = ["bamboo-core>=1.1,<2"]
embedding = ["chromadb>=0.5"]
llm = ["httpx>=0.27"]
opensearch = ["opensearch-py>=2.4"]
dev = ["pytest>=8", "flake8>=7", "pydocstyle>=6", "pyright>=1.1.350"]

[project.scripts]
bamboo-eval = "bamboo_eval.cli.main:main"

[project.urls]
Homepage = "https://github.com/PalNilsson/bamboo-eval"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["bamboo_eval*"]

[tool.setuptools.package-data]
bamboo_eval = ["data/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.pydocstyle]
convention = "google"
