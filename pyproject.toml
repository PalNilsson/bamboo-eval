[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bamboo-eval"
version = "0.1.0"
description = "Bamboo Evaluation Framework — measures retrieval, selection and relevance against labelled corpora, on the production code path."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Paul Nilsson", email = "Paul.Nilsson@cern.ch" }]
# Deliberately empty. The deterministic metrics are pure standard library so
# they run on a bare checkout; a metric that needs a backend degrades to a
# recorded skip with a reason, never to a wrong number. bamboo-core is NOT a
# hard dependency so that `pip install bamboo-eval` in a CI job that only reads
# stored results does not drag in the server; production.py raises a typed
# error naming the install command when a metric actually needs it.
dependencies = []

[project.optional-dependencies]
# The system under test. Install from a checkout:
#   pip install -e ../bamboo-mcp/core -e ../bamboo-mcp/packages/askpanda_atlas
bamboo = ["bamboo-core>=1.1,<2"]
embedding = ["chromadb>=0.5"]
llm = ["httpx>=0.27"]
opensearch = ["opensearch-py>=2.4"]
dev = ["pytest>=8", "flake8>=7", "pydocstyle>=6", "pyright>=1.1.350"]

[project.scripts]
bamboo-eval = "bamboo_eval.cli.main:main"

[project.urls]
Homepage = "https://github.com/PalNilsson/bamboo-eval"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["bamboo_eval*"]

[tool.setuptools.package-data]
bamboo_eval = ["data/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.pydocstyle]
convention = "google"

# pylint takes explicit targets; it does not default to the working directory
# the way flake8 and pydocstyle do. Run it as `pylint src tests`.
[tool.pylint.format]
# Matches .flake8, so the two linters cannot disagree about one line.
max-line-length = 200

[tool.pylint."messages control"]
# duplicate-code is cross-file and cannot be suppressed from inside either
# file, so it is disabled here rather than in the sources. It fires on the
# EvalRecord(...) construction shared by record.py and metrics/tool_retrieval.py:
# both are explicit field mappings, and hiding them behind a helper would
# conceal which fields a metric actually sets, which is the one thing a reader
# of a stored row needs to know.
disable = ["duplicate-code"]

# Everything else pylint objects to is pytest idiom, and is disabled per file
# in the test modules that provoke it rather than globally — so that
# inconsistent-return-statements and unused-argument keep working on src/,
# where they catch real defects.

[tool.pylint.design]
# pylint's R09xx defaults are tuned for object-oriented application code. This
# package is frozen dataclasses and functions with explicit, named parameters,
# so the defaults fire on shapes that are deliberate. Raised to fit the code
# rather than reshaping the code to fit the linter — but raised, not disabled,
# so a function that genuinely sprawls still gets caught.
#
# max-args / max-positional-arguments: evaluate() and report_to_records() take
#   their inputs as named parameters. Collapsing them into a config object
#   would hide which inputs a measurement actually depends on, which is the one
#   thing a reader of a stored row needs to see.
# max-locals: evaluate()'s scoring loop names its intermediates. Splitting it
#   would scatter the arithmetic that is the most important thing in the
#   package to read correctly.
# max-attributes: CaseResult and EvalRecord are records. A record has fields.
# min-public-methods: retriever stubs implement a one-method Protocol, and
#   test classes are namespaces for related assertions.
# evaluate() in metrics/selection_accuracy.py takes ten: the planner, the
#   corpus, the catalogue, and seven named knobs that each change what the run
#   measures or what it costs. All but the first three are keyword-only, so the
#   call site reads as a list of settings rather than a row of bare values.
max-args = 10
max-positional-arguments = 8
max-locals = 25
max-attributes = 12
min-public-methods = 0
